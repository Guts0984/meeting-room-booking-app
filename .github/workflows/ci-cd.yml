name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Create backend environment file for CI
      - name: Create Backend Environment File
        env:
          JWT_SECRET: ci-test-secret-not-for-production
        run: |
          cat > backend/.env <<EOF
          PORT=3000
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=15m
          EOF

      # Build and start the database, backend and frontend
      - name: Start Docker Stack
        run: docker compose up -d --build

      # Wait for PostgreSQL to become healthy
      - name: Wait for Database
        timeout-minutes: 2
        run: |
          DB_ID="$(docker compose ps -q db)"

          if [ -z "$DB_ID" ]; then
            echo "Database container was not created."
            docker compose ps
            exit 1
          fi

          for i in $(seq 1 40); do
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' "$DB_ID")"

            if [ "$STATUS" = "healthy" ]; then
              echo "Database is healthy."
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker compose logs db
              exit 1
            fi

            echo "Waiting for database..."
            sleep 3
          done

          echo "Database did not become healthy in time."
          docker compose logs db
          exit 1

      # Set up Node.js for Playwright
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E Dependencies & Playwright Browsers
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Run end-to-end tests
      - name: Run Playwright Tests
        working-directory: ./e2e
        env:
          BASE_URL: http://localhost:5444
        run: npx playwright test

      # Print container logs if anything fails
      - name: Docker Logs on Failure
        if: failure()
        run: docker compose logs --no-color

      # Clean up containers and test database
      - name: Stop Docker Stack
        if: always()
        run: docker compose down -v
