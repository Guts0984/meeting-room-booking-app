name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Start your full Docker stack (Database, Backend, Frontend)
      - name: Start Docker Stack
        run: docker compose up -d --build

      # 2. Wait for PostgreSQL to be fully healthy
      - name: Wait for Database
        run: |
          until docker inspect --format="{{.State.Health.Status}}" $(docker compose ps -q db) | grep -m 1 "healthy"; do
            echo "Waiting for database..."
            sleep 3
          done

      # 3. Setup Node.js and run Playwright E2E Tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install E2E Dependencies & Playwright Browsers
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: ./e2e
        env:
          BASE_URL: http://localhost:5444
        run: npx playwright test

      # 4. Log in to Docker Hub (Only triggers on push to main)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 5. Build and Push Final Images to Docker Hub
      - name: Build and Push Backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/meeting-backend:latest

      - name: Build and Push Frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/meeting-frontend:latest
