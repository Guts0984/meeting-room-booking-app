name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-tests-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Create backend environment file before Docker Compose
      - name: Create Backend Environment File
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          mkdir -p backend
          cat > backend/.env <<EOF
          PORT=3000
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRES_IN=15m
          EOF

      # Start the Docker stack
      - name: Start Docker Stack
        run: docker compose up -d --build

      # Wait for PostgreSQL to be healthy
      - name: Wait for Database
        run: |
          until [ "$(docker compose ps -q db | xargs -r docker inspect --format='{{.State.Health.Status}}' 2>/dev/null)" = "healthy" ]; do
            echo "Waiting for database..."
            sleep 3
          done

      # Setup Node.js and run Playwright E2E tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install E2E Dependencies & Playwright Browsers
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: ./e2e
        env:
          BASE_URL: http://localhost:5444
        run: npx playwright test

      # Login to Docker Hub on pushes to main
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Build and push backend image
      - name: Build and Push Backend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/meeting-backend:latest

      # Build and push frontend image
      - name: Build and Push Frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/meeting-frontend:latest

      # Print logs if a step fails and clean up
      - name: Docker Logs on Failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker Stack
        if: always()
        run: docker compose down -v
